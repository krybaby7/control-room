name: Inspect existing jobs failure trace
on:
  push:
    branches: ['diagnostics/control-room-jobs-trace*']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/inspect-jobs-failure-trace.py
