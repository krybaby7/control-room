name: Control Room accessibility and browser acceptance
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - '.github/workflows/control-room-acceptance.yml'
      - 'playwright.acceptance.config.ts'
      - 'tests/acceptance/**'
      - 'components/**'
      - 'app/**'
      - 'lib/**'
      - 'scripts/test-worker.mjs'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.event_name }}-control-room-acceptance-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  acceptance:
    name: Native acceptance - ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Exact lockfile-matched browsers and OS dependencies; avoid per-job apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CONTROL_ROOM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run build
      - name: Verify locked browser package matches pinned image
        run: node -e "require('node:assert/strict').equal(require('playwright/package.json').version,'1.64.1')"
      - name: Match ephemeral browser home ownership to the container user
        run: node -e "const fs=require('node:fs'),home=process.env.HOME,s=fs.lstatSync(home);if(!s.isDirectory()||s.isSymbolicLink())throw new Error('Expected isolated directory');fs.chownSync(home,process.getuid(),process.getgid())"
      - run: npx playwright test --config playwright.acceptance.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-acceptance-${{ matrix.browser }}
          path: |
            acceptance-results.json
            test-results-acceptance/
          if-no-files-found: error
          retention-days: 7
