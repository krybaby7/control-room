name: Control Room serialization hash verification
on:
  push:
    branches: ['diagnostics/**']
    paths: ['.github/workflows/control-room-serialization-diagnostic.yml']
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: node --experimental-strip-types --test tests/agents*.test.ts tests/evaluation-import.test.ts tests/private-schema.test.ts tests/private-growth.test.ts tests/workspace-private-capacity.test.ts tests/attachment-cleanup-store.test.ts tests/recoverability-snapshot.test.ts tests/workspace-admission.test.ts tests/recovery-staged-inputs.test.ts tests/review-analysis-capacity.test.ts tests/backup-cleanup-http.test.ts tests/planning-module.test.ts tests/agent-artifact-http.test.ts tests/source-schedule-authority.test.ts tests/planning-cas-database.test.ts tests/sqlite-text-order.test.ts tests/recovery-install.test.ts tests/attachment-archive-restore.test.ts tests/backup-reauthorization-ui.test.ts tests/workspace-capacity.test.ts tests/integration-job-store.test.ts tests/source-store.test.ts tests/source-recoverability.test.ts tests/source-http.test.ts tests/scheduled-source-executor.test.ts tests/workspace-transaction.test.ts tests/evidence-transaction.test.ts tests/deletion-recovery.test.ts tests/recoverability-admission.test.ts tests/review-store.test.ts tests/automation-runner.test.ts tests/scheduled-backup.test.ts tests/workspace-read-current.test.ts tests/operational-watermarks.test.ts tests/mutation-admission-reader.test.ts tests/workspace-private-capacity-atomic-admission.test.ts tests/recoverability-auxiliary.test.ts tests/sqlite-batch-adapter.test.ts tests/recoverability-diagnostics.test.ts tests/workspace-export-validation.test.ts tests/evidence-module.test.ts tests/operational-health.test.ts tests/package-bridge-source-identity.test.ts tests/recoverability-row-hashes.test.ts tests/recoverability-assertion-batching.test.ts tests/evidence-export-pool.test.ts tests/history-subject-links.test.ts tests/serialization-hash.test.ts
      - run: npm run typecheck
        if: always()
      - run: npm run lint
        if: always()
  normal-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTROL_ROOM_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run test:benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-serialization-normal-benchmark
          path: benchmark-results/workspace.json
          if-no-files-found: error
          retention-days: 14
