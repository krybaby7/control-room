name: Control Room SHA work attribution (diagnostic only)
on:
  push:
    branches: ['diagnostics/control-room-sha-work*']
    paths:
      - '.github/workflows/control-room-sha-work-profile.yml'
      - 'scripts/benchmark-workspace.mjs'
      - 'lib/operational-watermarks.ts'
      - 'lib/workspace-store.ts'
      - 'lib/workspace-transaction.ts'
      - 'lib/private-capacity.ts'
      - 'lib/recoverability-*.ts'
      - 'lib/workspace-export.ts'
      - 'lib/*-module.ts'
      - 'lib/**/module.ts'
      - 'lib/private-*.ts'
  workflow_dispatch:
concurrency:
  group: control-room-sha-work-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTROL_ROOM_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CONTROL_ROOM_PROFILE_COMMANDS: '1'
      CONTROL_ROOM_PROFILE_HASH_WORK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: node --experimental-strip-types --test tests/hash-work-diagnostics.test.ts tests/recoverability-row-hashes.test.ts tests/serialization-hash.test.ts tests/recoverability-planning-capture.test.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: node --experimental-strip-types scripts/benchmark-workspace.mjs
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-sha-work-profile
          path: benchmark-results/workspace.json
          if-no-files-found: error
          retention-days: 14
