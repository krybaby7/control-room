name: Control Room agent contract checks
on:
  push:
    branches: ['feat/**']
    paths: ['lib/agents/**','lib/private-*.ts','lib/attachment-cleanup-store.ts','components/*job*','components/agents-view.tsx','components/evaluation-evidence.tsx','lib/workspace-*.ts','lib/module-columns.ts','lib/recoverability-*.ts','tests/agents*.test.ts','tests/evaluation-import.test.ts','tests/private-schema.test.ts','tests/private-growth.test.ts','tests/workspace-private-capacity.test.ts','tests/attachment-cleanup-store.test.ts','tests/recoverability-snapshot.test.ts','tests/workspace-admission.test.ts','tests/recovery-staged-inputs.test.ts','tests/review-analysis-capacity.test.ts','tests/backup-cleanup-http.test.ts','tests/planning-module.test.ts','tests/helpers/planning-cas-*','scripts/test-reporter.mjs','lib/background/job-store.ts','tests/agent-artifact-http.test.ts','tests/source-schedule-authority.test.ts','tests/planning-cas-database.test.ts','tests/sqlite-text-order.test.ts','tests/recovery-install.test.ts','tests/attachment-archive-restore.test.ts','tests/backup-reauthorization-ui.test.ts','tests/workspace-capacity.test.ts','tests/integration-job-store.test.ts','tests/source-store.test.ts','tests/source-recoverability.test.ts','tests/source-http.test.ts','tests/scheduled-source-executor.test.ts','tests/workspace-transaction.test.ts','tests/evidence-transaction.test.ts','tests/deletion-recovery.test.ts','tests/recoverability-admission.test.ts','tests/review-store.test.ts','tests/automation-runner.test.ts','tests/scheduled-backup.test.ts','tests/workspace-read-current.test.ts','tests/operational-watermarks.test.ts','tests/sqlite-batch-adapter.test.ts','tests/helpers/sqlite.ts','lib/operational-health.ts','app/api/health/route.ts','scripts/package-bridge.mjs','lib/recoverability-auxiliary.ts','lib/mutation-admission-reader.ts','tests/mutation-admission-reader.test.ts','tests/workspace-private-capacity-atomic-admission.test.ts','tests/recoverability-auxiliary.test.ts','tests/recoverability-diagnostics.test.ts','tests/workspace-export-validation.test.ts','tests/evidence-module.test.ts','tests/operational-health.test.ts','tests/package-bridge-source-identity.test.ts','tests/recoverability-row-hashes.test.ts','tests/recoverability-assertion-batching.test.ts','tests/evidence-export-pool.test.ts','tests/history-subject-links.test.ts','lib/history-subject-links.ts','lib/serialization-hash.ts','tests/serialization-hash.test.ts','lib/release-package-policy.ts','tests/release-package-policy.test.ts','scripts/package-candidate.mjs','tests/package-candidate-generated-output.test.ts','lib/backup-archive-object-stream.ts','lib/backup-archive-storage.ts','lib/automations/backup-archive-store.ts','tests/backup-archive-object-stream.test.ts','tests/recoverability-read-pages.test.ts','db/schema.ts','drizzle/**','.github/workflows/control-room-agents.yml']
concurrency:
  group: control-room-agents-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: node scripts/test-reporter.mjs --self-test
      - run: node --experimental-strip-types --test tests/agents*.test.ts tests/evaluation-import.test.ts tests/private-schema.test.ts tests/private-growth.test.ts tests/workspace-private-capacity.test.ts tests/attachment-cleanup-store.test.ts tests/recoverability-snapshot.test.ts tests/workspace-admission.test.ts tests/recovery-staged-inputs.test.ts tests/review-analysis-capacity.test.ts tests/backup-cleanup-http.test.ts tests/planning-module.test.ts tests/agent-artifact-http.test.ts tests/source-schedule-authority.test.ts tests/planning-cas-database.test.ts tests/sqlite-text-order.test.ts tests/recovery-install.test.ts tests/attachment-archive-restore.test.ts tests/backup-reauthorization-ui.test.ts tests/workspace-capacity.test.ts tests/integration-job-store.test.ts tests/source-store.test.ts tests/source-recoverability.test.ts tests/source-http.test.ts tests/scheduled-source-executor.test.ts tests/workspace-transaction.test.ts tests/evidence-transaction.test.ts tests/deletion-recovery.test.ts tests/recoverability-admission.test.ts tests/review-store.test.ts tests/automation-runner.test.ts tests/scheduled-backup.test.ts tests/workspace-read-current.test.ts tests/operational-watermarks.test.ts tests/mutation-admission-reader.test.ts tests/workspace-private-capacity-atomic-admission.test.ts tests/recoverability-auxiliary.test.ts tests/sqlite-batch-adapter.test.ts tests/recoverability-diagnostics.test.ts tests/workspace-export-validation.test.ts tests/evidence-module.test.ts tests/operational-health.test.ts tests/package-bridge-source-identity.test.ts tests/recoverability-row-hashes.test.ts tests/recoverability-assertion-batching.test.ts tests/evidence-export-pool.test.ts tests/history-subject-links.test.ts tests/serialization-hash.test.ts tests/recoverability-read-pages.test.ts tests/release-package-policy.test.ts tests/package-candidate-generated-output.test.ts tests/backup-archive-object-stream.test.ts
      - run: npm run typecheck
        if: always()
      - run: npm run lint
        if: always()
